<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Academy - Chat</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* CSS Essencial Mínimo (Animações e correção de layout) */
        body { height: 100vh; height: -webkit-fill-available; }
        html { height: -webkit-fill-available; }
        
        .msg-content { white-space: pre-wrap; }
        .msg-container { position: relative; max-width: 90%; margin-bottom: 15px; }

        .loader { width: 12px; height: 12px; border-radius: 50%; background: #8b459d; animation: typing 1s infinite alternate; margin: 0 4px; }
        .loader:nth-child(2) { animation-delay: 0.2s; }
        .loader:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { from { transform: translateY(0); opacity: 0.7; } to { transform: translateY(-4px); opacity: 1; } }
        
        @keyframes pulse-cws { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        #speech-button.recording { animation: pulse-cws 1.5s infinite ease-in-out; }
        #speech-button.unsupported { display: none; }
        
        /* Notificação de Cópia */
        #copy-notification { position: fixed; bottom: 100px; right: 20px; padding: 10px 20px; background-color: #8b459d; color: white; border-radius: 8px; z-index: 1000; opacity: 0; transition: opacity 0.3s ease-in-out; }

        /* Esconder/Mostrar ícone de envio para responsividade */
        .send-text { display: none; }
        .send-icon { display: block; }
        @media (min-width: 640px) { .send-text { display: block; } .send-icon { display: none; } }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cws-bg': '#141416', 'cws-text': '#f0f0f0', 'cws-accent': '#8b459d', 'cws-secondary': '#424242', 'cws-input-border': '#555555',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], }
                }
            }
        }
    </script>
</head>
<body class="h-screen flex flex-col bg-cws-bg antialiased text-cws-text">

    <!-- Cabeçalho com Título e Logo -->
    <header class="bg-cws-bg p-4 flex items-center justify-between shadow-lg border-b border-cws-secondary px-6">
        <span class="text-cws-text text-xl font-bold">AI Chat - Academy</span>
        <img src="https://v.fastcdn.co/t/869bbf5c/a82c00e0/1760449425-64878728-159x52-logo-platform-cinza-.png" alt="CWS Platform Logo" class="h-8 sm:h-10 w-auto" />
    </header>

    <!-- Área de Mensagens -->
    <div id="chat" class="flex-1 p-4 sm:p-6 overflow-y-auto space-y-4 flex flex-col">
        <!-- Mensagem de boas-vindas inicial -->
        <div class="msg-container mr-auto">
            <div class="msg bot p-3 rounded-xl leading-snug text-sm md:text-base shadow-md bg-cws-secondary text-cws-text rounded-bl-none max-w-full">
                <span class="msg-content block pr-8">Olá! Eu sou o seu assistente de IA da CWS Platform, pronto para responder às suas perguntas. Como posso ajudar você hoje?</span>
                <button onclick="copyMessage(this)" class="copy-btn absolute top-1 right-1 p-1 rounded-full text-cws-text/50 hover:text-cws-text transition duration-150">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Indicator (Typing...) -->
    <div id="typing" class="p-3 pl-6 text-sm text-cws-text hidden items-center">
        <span class="mr-2">CWS AI está digitando</span>
        <div class="flex items-center"> <div class="loader"></div> <div class="loader"></div> <div class="loader"></div> </div>
    </div>

    <!-- Notificação de Cópia -->
    <div id="copy-notification" style="opacity: 0;">Texto copiado!</div>

    <!-- Área de Input (incluindo o botão de microfone) -->
    <div id="input-area" class="flex p-4 bg-cws-bg border-t border-cws-secondary shadow-xl items-center">
        
        <!-- Botão Microfone -->
        <button onclick="toggleSpeechRecognition()" id="speech-button" class="p-2 sm:p-3 mr-2 sm:mr-3 rounded-full text-cws-text transition duration-150 hover:bg-cws-accent/30 focus:outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mic sm:w-6 sm:h-6">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>
            </svg>
        </button>
        
        <input id="question" placeholder="Digite sua mensagem ou clique no microfone..." class="flex-1 p-3 text-base border border-cws-input-border rounded-lg focus:outline-none focus:ring-2 focus:ring-cws-accent bg-cws-secondary text-cws-text placeholder-gray-400 transition duration-150" onkeydown="if(event.key === 'Enter') send()" />
        
        <button onclick="send()" id="send-button" class="ml-2 sm:ml-3 px-3 sm:px-5 py-2 sm:py-3 text-base font-semibold border-none bg-cws-accent text-white rounded-lg cursor-pointer transition duration-150 hover:bg-purple-700 active:bg-purple-800 shadow-md flex items-center justify-center">
            <span class="send-text">Enviar</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send send-icon sm:w-6 sm:h-6"><path d="m22 2-7 20-4-9-9-4 20-7Z"/><path d="M15 7l-6 6"/></svg>
        </button>
    </div>

<script>
    const WORKER_URL = "https://ai-academy.gustavo-arruda.workers.dev/";
    let recognition = null;
    let isListening = false;
    const speechButton = document.getElementById("speech-button");

    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'pt-BR';

        recognition.onstart = () => {
            isListening = true;
            speechButton.classList.add('bg-cws-accent', 'recording', 'text-white');
            speechButton.classList.remove('text-cws-text');
        };
        recognition.onresult = (event) => { document.getElementById("question").value = event.results[0][0].transcript; };
        recognition.onend = () => {
            isListening = false;
            speechButton.classList.remove('bg-cws-accent', 'recording', 'text-white');
            speechButton.classList.add('text-cws-text');
            if (document.getElementById("question").value.trim()) send();
        };
        recognition.onerror = (event) => {
            isListening = false;
            speechButton.classList.remove('bg-cws-accent', 'recording', 'text-white');
            speechButton.classList.add('text-cws-text');
            console.error('Erro de reconhecimento de voz:', event.error);
        };
    } else { speechButton.classList.add('unsupported'); }

    function toggleSpeechRecognition() {
        if (!recognition) return;
        isListening ? recognition.stop() : (document.getElementById("question").value = "", recognition.start());
    }
    
    async function fetchWithBackoff(url, options, retries = 3) {
        for (let i = 0; i < retries; i++) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) {
                    const errorDetails = await response.json().catch(() => ({ message: `Status: ${response.status}` }));
                    throw new Error(`Worker Error: ${errorDetails.message || errorDetails.error || JSON.stringify(errorDetails)}`);
                }
                return response;
            } catch (error) {
                if (i === retries - 1) throw error;
                const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                await new Promise(resolve => setTimeout(resolve, delay));
            }
        }
    }

    async function send() {
        const input = document.getElementById("question"), typing = document.getElementById("typing"),
              button = document.getElementById("send-button"), speechBtn = document.getElementById("speech-button");
        
        const text = input.value.trim();
        if (!text) return;

        // 1. Exibe mensagem do usuário e desabilita input
        addMessage(text, "user");
        input.value = "";
        input.disabled = button.disabled = speechBtn.disabled = true;
        button.classList.add('opacity-50', 'cursor-not-allowed');
        speechBtn.classList.add('opacity-50', 'cursor-not-allowed');

        typing.style.display = "flex";
        let botResponse = "Erro ao responder.";

        try {
            const response = await fetchWithBackoff(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Access-Control-Allow-Origin": "*" },
                body: JSON.stringify({ question: text })
            });
            const data = await response.json();
            botResponse = data.answer || "Erro ao responder.";
        } catch (error) {
            console.error("Erro na comunicação com o Worker:", error);
            botResponse = `Erro de Conexão: ${error.message}. Verifique se o Worker está ativo.`;
        } finally {
            // 3. Finaliza
            typing.style.display = "none";
            input.disabled = button.disabled = speechBtn.disabled = false;
            button.classList.remove('opacity-50', 'cursor-not-allowed');
            speechBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            input.focus(); 
            addMessage(botResponse, "bot");
        }
    }

    function addMessage(text, type) {
        const chat = document.getElementById("chat");
        const container = document.createElement("div");
        container.className = `msg-container ${type === 'user' ? 'ml-auto' : 'mr-auto'}`;

        const div = document.createElement("div");
        let baseClasses = "p-3 rounded-xl leading-snug text-sm md:text-base shadow-md relative";

        if (type === "user") {
            div.className = `msg user ${baseClasses} bg-cws-accent text-white rounded-br-none`;
        } else {
            div.className = `msg bot ${baseClasses} bg-cws-secondary text-cws-text rounded-bl-none`;
        }

        const content = document.createElement("span");
        content.className = "msg-content block pr-8"; 
        content.textContent = text;
        div.appendChild(content);

        const copyButton = document.createElement('button');
        const copyIconClass = type === 'bot' ? 'text-cws-text/50 hover:text-cws-text' : 'text-white/50 hover:text-white';
        copyButton.className = `copy-btn absolute top-1 right-1 p-1 rounded-full transition duration-150 ${copyIconClass}`;
        copyButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>`;
        copyButton.onclick = function() { copyMessage(this); };
        div.appendChild(copyButton);

        container.appendChild(div);
        chat.appendChild(container);
        chat.scrollTop = chat.scrollHeight;
    }
    
    function copyMessage(buttonElement) {
        const messageContent = buttonElement.parentNode.querySelector('.msg-content');
        if (!messageContent) return;
        const textToCopy = messageContent.textContent;
        
        if (document.execCommand) {
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            textarea.style.position = 'fixed'; 
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showCopyNotification();
            } catch (err) { console.error('Erro ao copiar texto:', err); }
            document.body.removeChild(textarea);
        } else {
            navigator.clipboard.writeText(textToCopy).then(() => { showCopyNotification(); }).catch(err => { console.error('Erro ao copiar texto via Clipboard API:', err); });
        }
    }

    function showCopyNotification() {
        const notification = document.getElementById('copy-notification');
        notification.style.opacity = 1;
        setTimeout(() => { notification.style.opacity = 0; }, 2000);
    }
</script>

</body>
</html>

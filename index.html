<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>AI Academy - Chat</title>
  <style>
    body {
      margin: 0;
      background: #f4f4f7;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #111827;
      padding: 15px;
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }
    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    .msg {
      max-width: 80%;
      margin-bottom: 15px;
      padding: 12px 16px;
      border-radius: 15px;
      line-height: 1.4;
      font-size: 15px;
      white-space: pre-wrap;
    }
    .user {
      background: #2563eb;
      color: white;
      align-self: flex-end;
      margin-left: auto;
      border-bottom-right-radius: 0;
    }
    .bot {
      background: white;
      border: 1px solid #ddd;
      color: #111;
      align-self: flex-start;
      margin-right: auto;
      border-bottom-left-radius: 0;
    }

    /* Área de envio */
    #input-area {
      display: flex;
      padding: 15px;
      background: white;
      border-top: 1px solid #ddd;
    }
    #question {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      border: 1px solid #aaa;
      border-radius: 8px;
    }
    button {
      margin-left: 10px;
      padding: 12px 18px;
      font-size: 15px;
      border: none;
      background: #10b981;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #059669;
    }

    /* Loading (digitando...) */
    #typing {
      font-style: italic;
      opacity: 0.7;
      margin-bottom: 10px;
      display: none;
    }
  </style>
</head>
<body>

<header>AI Academy — Chat</header>

<div id="chat"></div>

<div id="typing">AI Academy está digitando...</div>

<div id="input-area">
  <input id="question" placeholder="Digite sua mensagem..." />
  <button onclick="send()">Enviar</button>
</div>

<script>
async function send() {
  const input = document.getElementById("question");
  const chat = document.getElementById("chat");
  const typing = document.getElementById("typing");

  const text = input.value.trim();
  if (!text) return;

  // Exibe mensagem do usuário
  addMessage(text, "user");
  input.value = "";

  // Mostra "digitando..."
  typing.style.display = "block";

  // Faz a chamada ao Worker
  const response = await fetch("https://ai-academy.gustavo-arruda.workers.dev/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: text })
  });

  const data = await response.json();

  // some typing
  typing.style.display = "none";

  // Adiciona a resposta da IA
  addMessage(data.answer || "Erro ao responder.", "bot");
}

// Exibe mensagens no chat
function addMessage(text, type) {
  const chat = document.getElementById("chat");

  const div = document.createElement("div");
  div.className = `msg ${type}`;
  div.textContent = text;

  chat.appendChild(div);

  // Scroll automático
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>

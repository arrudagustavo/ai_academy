<script>
    // --- Configuração da API do Worker ---
    // ⚠️ SUBSTITUA ESTE VALOR PELA URL REAL DO SEU WORKER NA CLOUDFLARE ⚠️
    const WORKER_URL = "https://ai-academy.gustavo-arruda.workers.dev"; // Ex: https://ai-academy.arrudagustavo.workers.dev
    const API_URL = WORKER_URL; // O endpoint é o Worker

    // --- Web Speech API Variáveis ---
    let recognition = null;
    let isListening = false;
    const speechButton = document.getElementById("speech-button");

    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'pt-BR';

        recognition.onstart = function() {
            isListening = true;
            speechButton.classList.add('bg-cws-accent', 'recording', 'text-white');
            speechButton.classList.remove('text-cws-text');
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            document.getElementById("question").value = transcript;
        };

        recognition.onend = function() {
            isListening = false;
            speechButton.classList.remove('bg-cws-accent', 'recording', 'text-white');
            speechButton.classList.add('text-cws-text');
        };

        recognition.onerror = function(event) {
            isListening = false;
            speechButton.classList.remove('bg-cws-accent', 'recording', 'text-white');
            speechButton.classList.add('text-cws-text');
            console.error('Erro de reconhecimento de voz:', event.error);
            if (event.error !== 'no-speech' && event.error !== 'aborted') {
                document.getElementById("question").placeholder = "Erro no microfone. Tente digitar.";
                setTimeout(() => {
                    document.getElementById("question").placeholder = "Digite sua mensagem ou clique no microfone...";
                }, 3000);
            }
        };
    } else {
        speechButton.classList.add('unsupported');
    }

    function toggleSpeechRecognition() {
        if (!recognition) return;

        if (isListening) {
            recognition.stop();
        } else {
            document.getElementById("question").value = "";
            recognition.start();
            // onstart lida com a mudança de estado e classe
        }
    }

    // Função para adicionar mensagem ao chat
    function addMessage(text, type) {
        const chat = document.getElementById("chat");

        // Contêiner principal para a mensagem (necessário para o posicionamento do botão de cópia)
        const container = document.createElement("div");
        container.className = `msg-container ${type === 'user' ? 'ml-auto' : 'mr-auto'}`;

        // Balão da Mensagem
        const div = document.createElement("div");
        let baseClasses = "p-3 rounded-xl leading-snug text-sm md:text-base shadow-md relative";

        if (type === "user") {
            div.className = `msg user ${baseClasses} bg-cws-accent text-white rounded-br-none`;
        } else {
            div.className = `msg bot ${baseClasses} bg-cws-secondary text-cws-text rounded-bl-none`;
        }

        // Conteúdo da Mensagem (para pre-wrap)
        const content = document.createElement("span");
        content.className = "msg-content block pr-8"; // Adiciona padding para o botão de cópia
        content.textContent = text;
        div.appendChild(content);

        // Botão Copiar
        const copyButton = document.createElement('button');
        copyButton.className = 'copy-btn absolute top-1 right-1 p-1 rounded-full text-white/50 hover:text-white transition duration-150';
        // Ajusta a cor do ícone de cópia dependendo do balão
        if (type === 'bot') {
            copyButton.className = 'copy-btn absolute top-1 right-1 p-1 rounded-full text-cws-text/50 hover:text-cws-text transition duration-150';
        }
        copyButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>`;
        copyButton.onclick = function() { copyMessage(this); };
        div.appendChild(copyButton);

        container.appendChild(div);
        chat.appendChild(container);

        chat.scrollTop = chat.scrollHeight;
    }

    // Função para copiar o texto da mensagem
    function copyMessage(buttonElement) {
        // Pega o elemento span.msg-content que contém o texto
        const messageContent = buttonElement.parentNode.querySelector('.msg-content');
        if (!messageContent) return;

        const textToCopy = messageContent.textContent;

        // Usa document.execCommand('copy') como fallback para ambientes restritos
        if (document.execCommand) {
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            textarea.style.position = 'fixed'; // Evita que apareça na tela
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showCopyNotification();
            } catch (err) {
                console.error('Erro ao copiar texto:', err);
            }
            document.body.removeChild(textarea);
        } else {
            // Fallback mais moderno se o execCommand falhar (embora menos provável em canvas)
            navigator.clipboard.writeText(textToCopy).then(() => {
                showCopyNotification();
            }).catch(err => {
                console.error('Erro ao copiar texto via Clipboard API:', err);
            });
        }
    }

    // Função para mostrar a notificação de cópia
    function showCopyNotification() {
        const notification = document.getElementById('copy-notification');
        notification.style.opacity = 1;
        setTimeout(() => {
            notification.style.opacity = 0;
        }, 2000);
    }


    // Função utilitária para fetch com backoff exponencial
    async function fetchWithBackoff(url, options, retries = 3) {
        for (let i = 0; i < retries; i++) {
            try {
                const response = await fetch(url, options);
                
                // Se o status não for 2xx (ex: 404, 500, 401), lança erro
                if (!response.ok) {
                    // Tenta ler o JSON do erro para depuração
                    const errorDetails = await response.json().catch(() => ({ message: `Status: ${response.status}` }));
                    throw new Error(`Worker Error: ${errorDetails.message || errorDetails.error || JSON.stringify(errorDetails)}`);
                }
                return response;
            } catch (error) {
                if (i === retries - 1) {
                    throw error; // Última tentativa falhou
                }
                // Atraso exponencial: 1s, 2s, 4s, ... + jitter
                const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                await new Promise(resolve => setTimeout(resolve, delay));
            }
        }
    }

    // Função principal para enviar a mensagem
    async function send() {
        // Se estiver ouvindo, pare a gravação antes de enviar
        if (isListening && recognition) {
            recognition.stop();
        }

        const input = document.getElementById("question");
        const typing = document.getElementById("typing");
        const button = document.getElementById("send-button");
        const speechBtn = document.getElementById("speech-button");

        const userText = input.value.trim();
        if (!userText) return;

        // 1. Exibir mensagem do usuário e desabilitar input
        addMessage(userText, "user");
        input.value = "";
        input.disabled = true;
        button.disabled = true;
        speechBtn.disabled = true;
        button.classList.add('opacity-50', 'cursor-not-allowed');
        speechBtn.classList.add('opacity-50', 'cursor-not-allowed');

        // 2. Mostrar "digitando..."
        typing.style.display = "flex";

        let botResponse = "Desculpe, não foi possível obter uma resposta no momento. Tente novamente mais tarde.";

        try {
            // O Worker RAG espera um payload simples: { question: "..." }
            const payload = {
                question: userText
            };

            const options = {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    // Não é estritamente necessário, mas bom para garantir
                    'Access-Control-Allow-Origin': '*' 
                },
                body: JSON.stringify(payload)
            };

            // Chama o seu Worker na Cloudflare
            const response = await fetchWithBackoff(API_URL, options);
            const result = await response.json();

            // O Worker RAG retorna: { answer: "..." }
            if (result && result.answer) {
                botResponse = result.answer;
            } else {
                // Captura e exibe a mensagem de erro detalhada do Worker
                console.error("Erro na resposta do Worker:", result);
                botResponse = result.message || result.error || "A resposta do Worker está vazia ou malformada.";
            }

        } catch (error) {
            console.error("Erro durante a chamada ao Worker:", error);
            // Exibe o erro de rede/conexão
            botResponse = `Erro de Conexão: ${error.message}. Verifique a URL do Worker.`;
        } finally {
            // 3. Ocultar "digitando..." e reabilitar input
            typing.style.display = "none";
            input.disabled = false;
            button.disabled = false;
            speechBtn.disabled = false;
            button.classList.remove('opacity-50', 'cursor-not-allowed');
            speechBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            input.focus(); // Retorna o foco para a caixa de texto

            // 4. Adicionar a resposta da IA
            addMessage(botResponse, "bot");
        }
    }
</script>
